# Test + Firebase Hosting. PR'da: testler bir kez (ubicloud), sonra her tasarım ayrı önizleme kanalına.
# main'de: PR'da geçen aynı ağaç yeniden test edilmez, seçili tasarım derlenip canlıya gider.
# Proje camasirhanefilm-web, site adı firebase.json'da ("recepivedik", 2026-10-31'de açıldı; anahtarı dosyaya yazan
# "site yoksa aç" adımı 2026-11-01'de kaldırıldı).
# Gereken sır: FIREBASE_SERVICE_ACCOUNT (yoksa yayın adımı atlanır).
name: Test ve yayın
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'push' && github.event.pull_request.draft != true
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    # main'e push'ta test işi atlanır (PR'da geçti); atlanmış test yayını engellemez, başarısız test engeller.
    if: >-
      always() && needs.test.result != 'failure' && needs.test.result != 'cancelled' &&
      github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Sır kullandığı için GitHub makinesinde kalır.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derle
        run: node scripts/build.mjs
      - id: sir
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        # Elle yapıştırılan anahtarda satır sonları bozulabiliyor; JSON gevşek okunup tek satıra çevrilir.
        run: |
          if [ -z "$SA" ]; then echo "::notice::FIREBASE_SERVICE_ACCOUNT yok, yayın atlandı"; exit 0; fi
          SA_JSON=$(python3 -c 'import json,os; print(json.dumps(json.loads(os.environ["SA"], strict=False)))')
          echo "::add-mask::$SA_JSON"
          echo "FIREBASE_SA_JSON=$SA_JSON" >> "$GITHUB_ENV"
          echo "var=1" >> "$GITHUB_OUTPUT"
      - if: steps.sir.outputs.var == '1'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SA_JSON }}
          projectId: camasirhanefilm-web
          # Önizleme adı tasarım seçimi sırasında "pr-N-seri" idi; adres değişmesin diye korunur.
          channelId: ${{ github.event_name == 'pull_request' && format('pr-{0}-seri', github.event.number) || 'live' }}
          expires: 7d

  # Cloudflare Workers statik site (taşıma, Togan 2026-11-25). Firebase yayını alan adı Cloudflare'e geçene kadar sürer.
  # Ayar wrangler.jsonc. Gereken sırlar: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" şablonu), CLOUDFLARE_ACCOUNT_ID.
  # Sırlar yoksa atlanır. PR → pr-N-recepivedik.<hesap>.workers.dev önizlemesi, main → canlı.
  cloudflare:
    needs: test
    if: >-
      always() && needs.test.result != 'failure' && needs.test.result != 'cancelled' &&
      github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Sır kullandığı için GitHub makinesinde kalır.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derle
        run: node scripts/build.mjs
      - name: Cloudflare'e yükle
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare sırları yok, yükleme atlandı"; exit 0
          fi
          if [ "${{ github.event_name }}" = pull_request ]; then
            # İlk kez: Worker henüz yoksa sürüm yüklenemez; önce bir kez kurulur (yalnız workers.dev adresinde, alan adı yok).
            npx --yes wrangler@4 versions upload --preview-alias "pr-$PR" | tee cf.log \
              || { npx --yes wrangler@4 deploy && npx --yes wrangler@4 versions upload --preview-alias "pr-$PR" | tee cf.log; }
          else
            npx --yes wrangler@4 deploy | tee cf.log
          fi
          grep -o 'https://[^ ]*workers.dev' cf.log | sort -u | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
